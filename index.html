<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Animation</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            /* Tall enough to scroll through all frames */
            height: 400vh;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        /* Loading overlay */
        #loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font-family: sans-serif;
            font-size: 1.2rem;
            z-index: 10;
            transition: opacity 0.6s ease;
        }
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #progress-bar-wrap {
            width: 240px;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            margin-top: 16px;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: #c2964b;
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body>

    <div id="loader">
        <span id="loader-text">Loading...</span>
        <div id="progress-bar-wrap">
            <div id="progress-bar"></div>
        </div>
    </div>

    <canvas id="video-canvas"></canvas>

    <script>
        const canvas  = document.getElementById('video-canvas');
        const ctx     = canvas.getContext('2d');
        const loader  = document.getElementById('loader');
        const bar     = document.getElementById('progress-bar');
        const loaderText = document.getElementById('loader-text');

        const FRAME_COUNT = 239;
        const PRELOAD_BEFORE_START = 15; // show first frame after these many frames loaded

        const framePath = i =>
            `./video_frames_30fps_jpg/frame_${String(i + 1).padStart(4, '0')}.jpg`;

        /* ── image pool ─────────────────────────────────────────── */
        const images = new Array(FRAME_COUNT);
        let loadedCount = 0;
        let started = false;
        let currentIndex = 0;

        function onFrameLoaded() {
            loadedCount++;
            const pct = Math.round((loadedCount / FRAME_COUNT) * 100);
            bar.style.width = pct + '%';

            // Once enough frames are ready, show the first frame and hide loader
            if (!started && loadedCount >= PRELOAD_BEFORE_START) {
                started = true;
                setCanvasSize();
                drawFrame(0);
                loader.classList.add('hidden');
                setTimeout(() => { loader.style.display = 'none'; }, 700);
            }
        }

        // Preload — set onload BEFORE src to avoid the race condition
        for (let i = 0; i < FRAME_COUNT; i++) {
            const img = new Image();
            img.onload  = onFrameLoaded;
            img.onerror = onFrameLoaded; // count errors too so loader always hides
            img.src = framePath(i);
            images[i] = img;
        }

        /* ── canvas sizing ──────────────────────────────────────── */
        function setCanvasSize() {
            const first = images[0];
            if (first && first.naturalWidth) {
                canvas.width  = first.naturalWidth;
                canvas.height = first.naturalHeight;
            } else {
                canvas.width  = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        }

        window.addEventListener('resize', () => {
            setCanvasSize();
            drawFrame(currentIndex);
        });

        /* ── drawing ────────────────────────────────────────────── */
        function drawFrame(index) {
            const img = images[index];
            if (!img) return;

            if (img.complete && img.naturalWidth) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                // Cover-fit: scale image to fill canvas, centred
                const scale = Math.max(
                    canvas.width  / img.naturalWidth,
                    canvas.height / img.naturalHeight
                );
                const w = img.naturalWidth  * scale;
                const h = img.naturalHeight * scale;
                const x = (canvas.width  - w) / 2;
                const y = (canvas.height - h) / 2;
                ctx.drawImage(img, x, y, w, h);
            } else {
                // Image not ready yet — draw when it arrives
                img.onload = () => {
                    if (currentIndex === index) drawFrame(index);
                };
            }
        }

        /* ── scroll handler ─────────────────────────────────────── */
        let ticking = false;

        window.addEventListener('scroll', () => {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(() => {
                const scrollTop    = window.scrollY || document.documentElement.scrollTop;
                const maxScroll    = document.documentElement.scrollHeight - window.innerHeight;
                const fraction     = maxScroll > 0 ? scrollTop / maxScroll : 0;
                currentIndex       = Math.min(FRAME_COUNT - 1, Math.max(0, Math.floor(fraction * FRAME_COUNT)));
                drawFrame(currentIndex);
                ticking = false;
            });
        }, { passive: true });
    </script>
</body>
</html>
